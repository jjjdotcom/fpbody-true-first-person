// True First Person - keys for the moves from the Half-Life 2 "Freeman" mod.
// Runs at every start; edit or delete lines freely.

bind v pm_kick        // kick (look down to stomp, jump first for a drop kick)
bind b pm_atease      // lower / raise your gun (it also lowers by itself after 4 quiet seconds)
bind g pm_holster     // put your gun away (empty hands); again, or fire, takes it out
bind z pm_prone       // lie down / get up (or double-tap duck)
bind shift +alt1      // sprint (hold, moving forward); stamina refills a second after you stop
                      // (Half-Life's walk key was +speed on shift: bind it elsewhere if you use it)

// Controller - the Half-Life 2: Freeman layout. With Steam Input on, Steam turns the
// buttons into these keys (set them in Steam's controller layout for the game):
//   Controller          Steam key          Action
bind mouse1 +attack        // RT                Mouse 1        fire
bind mouse2 +attack2       // LT                Mouse 2        alt fire
bind space +jump           // A                 Space          jump
bind ctrl +duck            // B                 Ctrl           crouch; double-tap for prone
bind r +reload             // X                 R              reload; double-tap: holster all
bind e +use                // Y                 E              use
bind shift +alt1           // LB                Shift          sprint
bind v pm_kick             // RB                V              kick
bind b pm_atease           // Back / View       B              lower / raise your gun
                           // Start / Menu      Escape         menu (the engine's own key)
bind g pm_holster          // Left stick click  G              holster all
bind z pm_prone            // Right stick click Z              prone
bind f impulse 100         // D-pad up          F              flashlight
bind q lastinv             // D-pad down        Q              last weapon
bind mwheelup fp_invprev   // D-pad left        Mouse wheel up    previous weapon (no confirm press)
bind mwheeldown fp_invnext // D-pad right       Mouse wheel down  next weapon (no confirm press)

// Vaulting: jump at a ledge or low wall while holding forward.
// Wall climbing: jump at a wall and keep holding jump (+ forward to pull up onto the top).
// Slide: duck while running.
// Double-tap reload: holster all (cl_fpbody_doubletap 0 turns the double-taps off).

cl_fpbody_atease_delay 4
cl_fpbody_classic 0         // GMod / Left 4 Dead animations and the HL:S bodies (1 = Half-Life's original animations)
